; QuickLoot settings without SkyUI.
; With SkyUI installed, its settings menu (MCM) replaces everything in this file.
; Every line is optional: a missing or invalid value keeps the default shown here.
; true/false also accept 1/0, yes/no, on/off. Sections are only for reading; key names are what count.

[Behavior]
ShowInCombat = true
ShowWhenEmpty = false
ShowWhenSneaking = true
ShowWhenUnlocked = true
ShowInThirdPerson = true
ShowWhenMounted = false
EnableForContainers = true
EnableForCorpses = true
EnableForAnimals = true
EnableForDragons = true
BreakInvisibility = true
PlayScrollSound = true

[Window]
WindowOffsetX = 100
WindowOffsetY = -200
WindowScale = 1.0
; 0 top left, 1 center left, 2 bottom left, 3 top center, 4 center, 5 bottom center, 6 top right, 7 center right, 8 bottom right
WindowAnchor = 0
WindowMinLines = 0
WindowMaxLines = 7
WindowOpacityNormal = 1.0
WindowOpacityEmpty = 0.3

[Icons]
ShowIconItem = true
; Off by default: it compares every item with what you have equipped.
ShowIconBest = false
ShowIconRead = true
ShowIconStolen = true
ShowIconEnchanted = true
ShowIconEnchantedKnown = true
ShowIconEnchantedSpecial = true
ShowIconArtifactNew = true
ShowIconArtifactCarried = true
ShowIconArtifactDisplayed = true
ShowIconCompletionistNeeded = true
ShowIconCompletionistCollected = true
ShowIconCompletionistDisplayable = true
ShowIconCompletionistDisplayed = true
ShowIconCompletionistOccupied = true

[Columns]
; Comma-separated: value, weight, valuePerWeight
InfoColumns = value, weight, valuePerWeight

[Sorting]
; Comma-separated sort rules, first wins (the same names as the MCM's, for example $qlie_SortRule_Gold).
; Empty = the window's own order.
SortRulesActive =

[Controls]
; Take is always Activate and Search is always Ready Weapon, so they aren't set here.
; Optional keys to turn the window off and on again (SKSE key codes, -1 = none).
KeybindingDisable = -1
KeybindingDisableModifier = -1
KeybindingEnable = -1
KeybindingEnableModifier = -1
KeybindingDisableGamepad = -1
KeybindingDisableGamepadModifier = -1
KeybindingEnableGamepad = -1
KeybindingEnableGamepadModifier = -1
